# منظومة السلامة — معهد الإدارة العامة — النشر على Render
# الأسرار لا تُكتب هنا: APP_KEY يولّده Render، وDB_URL من القاعدة.
databases:
  - name: ipa-safety-db
    databaseName: ipa_safety
    user: ipa_safety
    plan: free

services:
  - type: web
    name: ipa-safety
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: main
    healthCheckPath: /up
    # لا إعادة بناء عند تغيّر الوثائق وحدها (السجل والمرجعية والمهارات) — كل ما عداها يدخل في الصورة
    buildFilter:
      ignoredPaths:
        - "*.md"
        - "backend/**/*.md"
        - ".claude/**"
        - "backend/tests/gates/**"
    envVars:
      - key: APP_NAME
        value: "منظومة السلامة"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: "https://ipa-safety.onrender.com"
      - key: APP_LOCALE
        value: ar
      - key: APP_FALLBACK_LOCALE
        value: ar
      - key: APP_TIMEZONE
        value: Asia/Riyadh
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: ipa-safety-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: RUN_MIGRATIONS
        value: "true"
      # حساب مسؤول السلامة الأول: يُدخل من لوحة Render مرة واحدة (لا يُكتب هنا)، ويُحذف بعد الدخول.
      - key: IPA_ADMIN_USERNAME
        sync: false
      - key: IPA_ADMIN_PASSWORD
        sync: false
      - key: IPA_ADMIN_NAME
        sync: false
      # الحسابات التجريبية للتطوير فقط. أُطفئت عند قبول المرحلة ١ (٢٠٢٦-٠٩-٠٨).
      - key: SEED_DEMO
        value: "false"
      # قناة البريد (المرحلة ٨-٢). بلا هذه المفاتيح يقع Laravel على MAIL_MAILER=log:
      # الرسالة تُكتب في السجل ولا تصل أحداً بلا خطأ ظاهر — نصف قنوات §٦ معطّل صامتاً.
      # sync: false = تُدخل في لوحة Render ولا تُكتب في المستودع. أي خدمة تعطي SMTP تعمل.
      # التحقق من شاشة `/app/mail` برسالة اختبار.
      - key: MAIL_MAILER
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SCHEME
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
