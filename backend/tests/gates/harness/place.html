<!DOCTYPE html><html><head><meta charset="utf-8"></head>
<body><div id="out">running…</div><iframe id="f" style="width:1100px;height:900px;border:0"></iframe>
<script>
/* place.html?u=USER&p=PASS&hz=HZ-06 — يدخل بالخادم ويفتح ملف المكان في اللوحة ويطبع روابط الإجراءات. */
const q=new URLSearchParams(location.search), U=q.get('u')||'mudir', P=q.get('p')||'1234', HZ=q.get('hz')||'HZ-06';
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const f=document.getElementById('f');
const xsrf=()=>{const m=document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]+)/);return m?decodeURIComponent(m[1]):''};
(async()=>{
  await fetch('/login',{credentials:'same-origin'});
  await fetch('/logout',{method:'POST',credentials:'same-origin',headers:{'X-XSRF-TOKEN':xsrf(),'Accept':'application/json'}}).catch(()=>{});
  const h=await (await fetch('/login',{credentials:'same-origin'})).text();
  const tok=(h.match(/name="_token" value="([^"]+)"/)||[])[1];
  await fetch('/login',{method:'POST',credentials:'same-origin',redirect:'manual',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({_token:tok,username:U,password:P})});
  f.src='/dashboard.html#place='+HZ;
  await wait(2500);
  const w=f.contentWindow, d=f.contentDocument;
  const acts=[...d.querySelectorAll('#pf .pfh .acts a')].map(a=>a.textContent.trim()+' → '+a.getAttribute('href'));
  document.getElementById('out').textContent='RESULT '+JSON.stringify({user:U,role:w.ROLE,url:w.location.href,acts});
})();
</script></body></html>
