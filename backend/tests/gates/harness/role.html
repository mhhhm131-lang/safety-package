<!DOCTYPE html><html><head><meta charset="utf-8"></head>
<body><div id="out">running…</div><iframe id="f" style="width:1100px;height:900px;border:0"></iframe>
<script>
/* role.html?u=USERNAME&p=PASSWORD — حساب حقيقي (ليس من القائمة التجريبية):
   يدخل بالخادم، يفتح اللوحة ونموذج الأقبية، ويطبع الدور الذي دخل به كل منهما (من الجلسة لا من الأسماء المثبتة). */
const q=new URLSearchParams(location.search), U=q.get('u')||'', P=q.get('p')||'';
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const f=document.getElementById('f'); let w;
const xsrf=()=>{const m=document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]+)/);return m?decodeURIComponent(m[1]):''};
async function login(){
  await fetch('/login',{credentials:'same-origin'});
  await fetch('/logout',{method:'POST',credentials:'same-origin',headers:{'X-XSRF-TOKEN':xsrf(),'Accept':'application/json'}}).catch(()=>{});
  const h=await (await fetch('/login',{credentials:'same-origin'})).text();
  const tok=(h.match(/name="_token" value="([^"]+)"/)||[])[1];
  await fetch('/login',{method:'POST',credentials:'same-origin',redirect:'manual',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({_token:tok,username:U,password:P,next:'/vision.html'})});
  const r=await fetch('/api/store?versions=1',{credentials:'same-origin',headers:{'Accept':'application/json'}});
  return {status:r.status, session: r.status===200?(await r.json()).session:null};
}
async function open(url){
  const loaded=new Promise(r=>f.addEventListener('load',r,{once:true}));
  f.src=url+'?t='+Math.random();
  await Promise.race([loaded,wait(4000)]); w=f.contentWindow; await wait(900);
}
(async()=>{
  try{
    localStorage.clear();
    const s=await login();
    const out={login:s};
    await open('/dashboard.html');
    out.dash={entered:!w.document.getElementById('login')||w.document.getElementById('login').classList.contains('off'),ROLE:w.ROLE,USER:w.USER,uRole:(w.document.getElementById('uRole')||{}).textContent};
    await open('/HZ-01-basement/inspection-form.html');
    out.form={entered:w.document.getElementById('login').classList.contains('off'),ROLE:w.ROLE,bodyRole:w.document.body.dataset.role,uRole:(w.document.getElementById('uRole')||{}).textContent};
    document.getElementById('out').textContent='RESULT '+JSON.stringify(out);
  }catch(e){document.getElementById('out').textContent='RESULT '+JSON.stringify({error:String(e&&e.stack||e)});}
})();
</script></body></html>
